name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "APK 内置的后端地址（留空则首次打开时在应用内输入）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 同步前端资源并构建 APK
        env:
          APP_URL: ${{ github.event.inputs.app_url }}
        run: |
          bash android/build-apk-manual.sh
          ls -lh android/HGhub-*.apk
          aapt2 dump badging android/HGhub-*.apk | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity"

      - name: 验证 APK 签名与内容
        run: |
          apksigner verify --verbose android/HGhub-*.apk
          unzip -l android/HGhub-*.apk | grep -E "classes.dex|assets/hghub/"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/HGhub-*.apk

      - name: 上传到 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/HGhub-*.apk
          generate_release_notes: true
