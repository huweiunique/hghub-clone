name: temp-unzip
on:
  workflow_dispatch:
jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unzip source over main
        run: |
          unzip -o hghub-sp-repo.zip
          rm hghub-sp-repo.zip
      - name: Commit unpacked files
        run: |
          git config user.name "vps1986"
          git config user.email "vps1986@users.noreply.github.com"
          git add -A
          git commit -m "HGhub 1.2.0.8-sp: SHARE_BASE to sp1" || echo "nothing to commit"
          git push
