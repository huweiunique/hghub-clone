name: _build

# 供 nightly.yml / release.yml 复用的构建流程。
# 产出：APK + 未签名 IPA，并附上「本次包含哪些提交、改了什么」。
#
# 输入：
#   channel  nightly | stable
#   app_url  构建时内置的后端地址（留空则首次打开手填）
#
# 访问密钥【不参与构建】：用户在 App 首次打开时输入并保存在本机。
# 结构：notes（算说明）→ apk / ipa / docker（并行）→ publish（合并产物到同一个 Release）
#
# Docker 镜像（可选）：配置了 DOCKERHUB_USERNAME + DOCKERHUB_TOKEN 两个 secret 时，
# 自动构建多架构镜像并推送到 Docker Hub；没配置则跳过，不会让流水线失败。

on:
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      app_url:
        type: string
        required: false
        default: ""
    # 关键：workflow_call 默认【不继承】调用方的 secrets，
    # 不在这里声明的话，job 里取到的 ${{ secrets.DOCKERHUB_* }} 是空的，
    # job 会被"未配置凭据"逻辑跳过（本仓库踩过）。required: false 不会因缺失而失败。
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      title: ${{ steps.v.outputs.title }}
      # 产物文件名后缀：正式版为空，Nightly 为 -nightly-YYYYMMDD-<sha7>
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # 需要历史来生成提交清单

      - name: 计算版本标识
        id: v
        run: |
          if [ "${{ inputs.channel }}" = "stable" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "title=HGhub ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # 正式版文件名不带后缀：HGhub-1.2.0.8.apk
            echo "suffix=" >> "$GITHUB_OUTPUT"
          else
            echo "version=nightly" >> "$GITHUB_OUTPUT"
            echo "title=HGhub Nightly · $(date -u +%Y-%m-%d) · ${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            # Nightly 文件名带日期与提交：HGhub-1.2.0.8-nightly-20261113-4ab18bf.apk
            echo "suffix=-nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 生成发布说明（包含提交与改动）
        run: |
          OUT=notes.md
          {
            echo "## ${{ steps.v.outputs.title }}"
            echo ""
            if [ "${{ inputs.channel }}" = "stable" ]; then
              echo "> 正式版本，由维护者打 tag 发布。"
            else
              echo "> **Nightly 预发布**：自动构建的最新版本，可能不稳定。"
              echo "> 正式版本只由维护者打 \`vX.Y.Z\` tag 发布；这里每次覆盖更新。"
            fi
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 提交 | \`${GITHUB_SHA}\` |"
            echo "| 来源 | \`${GITHUB_REF_NAME}\` |"
            echo "| 构建时间 | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo "| 运行 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo "| 内置后端地址 | \`${{ inputs.app_url || '无（首次打开手填）' }}\` |"
            echo "| 访问密钥 | 不内置，首次打开在 App 内输入并保存 |"
            echo ""
            echo "### 下载"
            echo ""
            if [ "${{ inputs.channel }}" = "stable" ]; then
              echo "- \`HGhub-<版本>.apk\`：Android 7.0+，debug 签名，可直接安装"
              echo "- \`HGhub-<版本>-unsigned.ipa\`：iOS 16+，**未签名**，需 Sideloadly/AltStore 重签后安装"
            else
              echo "- \`HGhub-<版本>-nightly-<日期>-<提交>.apk\`：Android 7.0+，可直接安装"
              echo "- \`HGhub-<版本>-nightly-<日期>-<提交>-unsigned.ipa\`：iOS 16+，**未签名**，需重签后安装"
              echo ""
              echo "> 文件名里带日期和提交号，方便区分不同 Nightly 构建。"
            fi
            echo ""
            echo "### 本次包含的提交"
            echo ""
            if [ "${{ inputs.channel }}" = "stable" ]; then
              PREV=$(git describe --tags --abbrev=0 "${{ github.sha }}^" 2>/dev/null || echo "")
              RANGE="${PREV:+$PREV..}${{ github.sha }}"
              if [ -n "$PREV" ]; then echo "自 \`$PREV\` 以来："; else echo "首个正式版本。最近提交："; fi
            else
              RANGE="-25"
              echo "最近 25 条提交："
            fi
            echo ""
            git log --pretty=format:'- %h %s （%an，%ad）' --date=short $RANGE | head -40
            echo ""
            echo ""
            echo "### 改动的文件"
            echo ""
            echo '```'
            if [ "${{ inputs.channel }}" = "stable" ]; then
              git diff --stat "$RANGE" 2>/dev/null | tail -30 || true
            else
              git diff --stat HEAD~1 2>/dev/null | tail -20 || true
            fi
            echo '```'
          } > "$OUT"
          echo "--- 发布说明预览 ---"
          cat "$OUT"

      - uses: actions/upload-artifact@v5
        with:
          name: release-notes
          path: notes.md

  apk:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 构建 APK
        env:
          APP_URL: ${{ inputs.app_url }}
          ARTIFACT_SUFFIX: ${{ needs.notes.outputs.suffix }}
        run: |
          bash android/build-apk-manual.sh
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls android/HGhub-*.apk)
          echo "产物：$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion"
          "$BT/apksigner" verify --verbose "$APK"
          # 访问密钥不应内置：源码里 APP_ACCESS_KEY 必须为空字符串常量
          grep -q 'APP_ACCESS_KEY = ""' android/build-apk-manual.sh \
            || { echo "::error::build-apk-manual.sh 里 APP_ACCESS_KEY 必须为空"; exit 1; }
          mkdir -p dist && cp "$APK" dist/

      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/HGhub-*.apk

  ipa:
    needs: notes
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 验证优选 IP 本机连接通道
        run: |
          transport_status=0
          ranking_status=0
          python3 tests/test_prefip_transport.py -v || transport_status=$?
          python3 tests/test_prefip_ranking.py -v || ranking_status=$?
          if [ "$transport_status" -ne 0 ] || [ "$ranking_status" -ne 0 ]; then
            exit 1
          fi

      - name: 构建未签名 IPA
        env:
          APP_URL: ${{ inputs.app_url }}
          ARTIFACT_SUFFIX: ${{ needs.notes.outputs.suffix }}
        run: bash ios/build-ipa.sh

      - name: 检查 IPA 结构（并确认没有内置密钥）
        run: |
          unzip -l dist/HGhub-*.ipa | head -15
          CFG=$(unzip -p dist/HGhub-*.ipa "Payload/HGhub.app/AppConfig.plist")
          echo "$CFG" | plutil -p -
          echo "$CFG" | grep -A1 '<key>AccessKey</key>' | grep -q '<string></string>' \
            || { echo "::error::AppConfig.plist 里 AccessKey 不为空"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: ipa-unsigned
          path: dist/HGhub-*.ipa

  publish:
    needs: [notes, apk, ipa]
    runs-on: ubuntu-latest
    steps:
      # 不用批量/合并模式：多个 artifact 并发下载时会偶发
      # "Artifact download failed after 5 retries"（实际都下成功了，是内部重试误判）。
      # 改为逐个显式下载，每个指定准确的 name 和 path。
      - name: 下载 APK
        uses: actions/download-artifact@v5
        with:
          name: apk
          path: dist

      - name: 下载 IPA
        uses: actions/download-artifact@v5
        with:
          name: ipa-unsigned
          path: dist

      - name: 下载发布说明
        uses: actions/download-artifact@v5
        with:
          name: release-notes
          path: dist

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.notes.outputs.version }}
          name: ${{ needs.notes.outputs.title }}
          body_path: dist/notes.md
          prerelease: ${{ inputs.channel == 'nightly' }}
          fail_on_unmatched_files: true
          files: |
            dist/HGhub-*.apk
            dist/HGhub-*.ipa

  # ----------------------------------------------------------- Docker 镜像
  # 需要仓库 Secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Access Token，不是密码）
  # 两个都配了才会跑；否则整个 job 跳过。token 只在 login-action 里用，不会出现在日志。
  docker:
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 没有配置 Docker Hub 凭据则跳过
        id: gate
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$U" ] && [ -n "$T" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "user=$U" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，跳过镜像推送"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.enabled == 'true'

      - name: 设置 Buildx
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        if: steps.gate.outputs.enabled == 'true'
        run: |
          REPO="${{ steps.gate.outputs.user }}/hghub"
          SHA="${GITHUB_SHA::7}"
          BASE=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle | head -1 | sed 's/.*"\(.*\)"/\1/')
          OUTFILE="$RUNNER_TEMP/tags.txt"
          if [ "${{ inputs.channel }}" = "stable" ]; then
            # 正式版：v1.2.0.9 + 基线版本号 + latest
            printf '%s\n' "${REPO}:${{ github.ref_name }}" "${REPO}:${BASE}" "${REPO}:latest" > "$OUTFILE"
          else
            # Nightly：nightly 与 nightly-<sha>，绝不覆盖 latest
            printf '%s\n' "${REPO}:nightly" "${REPO}:nightly-${SHA}" > "$OUTFILE"
          fi
          {
            echo "repo=$REPO"
            echo "tags<<EOF"
            cat "$OUTFILE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "将推送："
          cat "$OUTFILE"

      - name: 构建并推送（linux/amd64 + linux/arm64）
        if: steps.gate.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APT_MIRROR=deb.debian.org
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=HGhub
            org.opencontainers.image.version=${{ needs.notes.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送结果
        if: steps.gate.outputs.enabled == 'true'
        run: |
          echo "### Docker 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect ${{ steps.meta.outputs.repo }}:$( [ "${{ inputs.channel }}" = "stable" ] && echo latest || echo nightly )

      # Nightly 每天产生一个 nightly-<sha>，不清理会一直堆积、吃满 Docker Hub 配额。
      # 这里只保留最近 5 个带 sha 的标签，更早的删除（nightly / latest / 版本号标签不动）。
      # 删除 tag 需要 delete 权限；token 没有该权限时脚本会跳过并给个 notice，不影响构建。
      - name: 清理旧的 nightly-<sha> 标签（保留最近 5 个）
        if: steps.gate.outputs.enabled == 'true' && inputs.channel == 'nightly'
        continue-on-error: true
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - "$REPO" "$U" "$T" <<'PY'
          import base64, json, os, sys, urllib.request, urllib.error

          repo, user, token = sys.argv[1], sys.argv[2], sys.argv[3]
          basic = base64.b64encode(f"{user}:{token}".encode()).decode()
          tok = json.load(urllib.request.urlopen(urllib.request.Request(
              f"https://auth.docker.io/token?service=registry.docker.io"
              f"&scope=repository:{repo}:pull,push,delete",
              headers={"Authorization": f"Basic {basic}"}), timeout=30))["token"]
          H = {"Authorization": f"Bearer {tok}"}

          def tags():
              r = urllib.request.urlopen(urllib.request.Request(
                  f"https://registry-1.docker.io/v2/{repo}/tags/list", headers=H), timeout=30)
              return json.load(r).get("tags") or []

          def digest(tag):
              req = urllib.request.Request(
                  f"https://registry-1.docker.io/v2/{repo}/manifests/{tag}", headers={
                      **H, "Accept": "application/vnd.oci.image.index.v1+json,"
                                     "application/vnd.docker.distribution.manifest.list.v2+json,"
                                     "application/vnd.oci.image.manifest.v1+json,"
                                     "application/vnd.docker.distribution.manifest.v2+json"})
              req.get_method = lambda: "HEAD"
              return urllib.request.urlopen(req, timeout=30).headers["Docker-Content-Digest"]

          all_tags = tags()
          shas = [t for t in all_tags if t.startswith("nightly-")]
          if len(shas) <= 5:
              print("nightly-<sha> 标签数", len(shas), "无需清理")
              sys.exit(0)
          for t in shas[: len(shas) - 5]:
              try:
                  d = digest(t)
                  req = urllib.request.Request(
                      f"https://registry-1.docker.io/v2/{repo}/manifests/{d}",
                      headers=H)
                  req.get_method = lambda: "DELETE"
                  urllib.request.urlopen(req, timeout=30)
                  print("已删除", t)
              except urllib.error.HTTPError as e:
                  print(f"::notice::删除 {t} 被拒绝（HTTP {e.code}）：token 可能没有 delete 权限，跳过")
                  break
          print("剩余：", ", ".join(tags()))
          PY
