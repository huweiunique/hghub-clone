name: Release

# 一键发版：打 tag 或手动触发，一次构建出 APK + IPA 并挂到同一个 Release。
#
#   git tag -a v1.2.0.8 -m "1.2.0.8" && git push origin v1.2.0.8
#   或：Actions → Release → Run workflow（可填后端地址/密钥）
#
# Android 在 ubuntu 上秒级完成；iOS 需要 GitHub 托管的 macOS runner，
# 该 runner 在部分账号上会长时间排队（见 docs/release.md）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      app_url:
        description: "内置后端地址（http://IP:8081/），留空则首次打开在 App 内填写"
        required: false
        default: ""
      access_key:
        description: "后端访问密钥（后端未开鉴权则留空）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # workflow_dispatch 可填；打 tag 时也可用仓库变量/密钥兜底
  APP_URL: ${{ inputs.app_url }}
  ACCESS_KEY: ${{ inputs.access_key }}

jobs:
  # ---------------------------------------------------------------- Android
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 安装 Android SDK 组件
        run: |
          SDK="$ANDROID_HOME"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: 构建 APK（内置后端地址 + 访问密钥）
        env:
          APP_URL: ${{ inputs.app_url }}
          APP_ACCESS_KEY: ${{ inputs.access_key }}
        run: |
          bash android/build-apk-manual.sh
          BT="$ANDROID_HOME/build-tools/34.0.0"
          APK=$(ls android/HGhub-*.apk)
          "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|launchable-activity"
          "$BT/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E "classes.dex|assets/hghub/"
          mkdir -p dist && cp "$APK" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/HGhub-*.apk

      - name: 上传 APK 到 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HGhub-*.apk

  # -------------------------------------------------------------------- iOS
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 构建未签名 IPA
        run: bash ios/build-ipa.sh

      - name: 检查 IPA 结构
        run: |
          unzip -l dist/HGhub-*.ipa | head -20
          unzip -p dist/HGhub-*.ipa "Payload/HGhub.app/Info.plist" | plutil -p - | head -20
          unzip -p dist/HGhub-*.ipa "Payload/HGhub.app/AppConfig.plist" | plutil -p -

      - uses: actions/upload-artifact@v4
        with:
          name: ipa-unsigned
          path: dist/HGhub-*.ipa

      - name: 上传 IPA 到 Release（tag）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HGhub-*.ipa
