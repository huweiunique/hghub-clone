name: Release

# 正式发版：只由维护者手动打 tag 触发。
#
#   git tag -a v1.2.0.9 -m "1.2.0.9" && git push origin v1.2.0.9
#
# 不带 tag 的任何构建都走 nightly.yml（Nightly 预发布），不会占用正式版本号。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      channel: stable
      app_url: ${{ vars.HGHUB_APP_URL || '' }}
