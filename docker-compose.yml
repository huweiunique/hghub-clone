# 一键起后端：docker compose up -d --build
#
# 手机/浏览器访问 http://<服务器IP>:8081/
# 8080 只给 8081 内部反代用（也映射出来，方便排查）
services:
  hghub:
    build:
      context: .
      dockerfile: Dockerfile
    image: hghub:1.2.0.8
    container_name: hghub
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8081"
      - "${PROXY_PORT:-8080}:8080"
    environment:
      PROXY_PORT: "8080"
      WEB_PORT: "8081"
      PROXY_BASE: "http://127.0.0.1:8080"
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
