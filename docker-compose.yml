# 一键起后端：docker compose up -d --build
#
# 手机/浏览器访问 http://<服务器IP>:8081/
# 8080 只给 8081 内部反代用（也映射出来，方便排查）
#
# 访问密钥（可选）通过环境变量传入，有两种方式：
#   1) 临时：HGHUB_ACCESS_KEY=$(openssl rand -hex 32) docker compose up -d
#   2) 持久：把下面几行写进同目录的 .env 文件（不要提交到 git）
#        HGHUB_ACCESS_KEY=xxxxxxxx
#        # 可选：只允许这些来源 IP（逗号分隔）
#        HGHUB_ALLOW_IPS=1.2.3.4
#        # 可选：放在 HTTPS 反代后面时
#        # HGHUB_TRUST_PROXY=1
#        # HGHUB_COOKIE_SECURE=1
#   不设 HGHUB_ACCESS_KEY 时服务公开可访问（仅建议内网）。
services:
  hghub:
    build:
      context: .
      dockerfile: Dockerfile
    image: hghub:1.2.0.8
    container_name: hghub
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:8081"
      - "${PROXY_PORT:-8080}:8080"
    environment:
      PROXY_PORT: "8080"
      WEB_PORT: "8081"
      PROXY_BASE: "http://127.0.0.1:8080"
      TZ: Asia/Shanghai
      # ---- 访问密钥（来自宿主机环境变量或 .env；未设置则为空 = 关闭鉴权）----
      HGHUB_ACCESS_KEY: "${HGHUB_ACCESS_KEY:-}"
      HGHUB_ALLOW_IPS: "${HGHUB_ALLOW_IPS:-}"
      HGHUB_TRUST_PROXY: "${HGHUB_TRUST_PROXY:-}"
      HGHUB_COOKIE_SECURE: "${HGHUB_COOKIE_SECURE:-}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
